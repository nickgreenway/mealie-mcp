name: Deploy to callisto

# Auto-deploy on every push to the `deploy` branch, via a self-hosted runner
# that lives ON the server (the Mealie box). The box is reachable outbound-only
# (behind the Cloudflare Tunnel, no open inbound ports), so instead of SSHing in
# from GitHub's cloud, the runner connects *outbound* to GitHub and runs the
# deploy locally.
#
# Unlike a plain source deploy, this service runs as a Docker container, so a
# `git pull` alone is NOT enough — the image must be rebuilt and the container
# recreated. This workflow does: pull -> docker compose build -> up -d.
#
# Configured for callisto (see deploy/DEPLOY.md):
#   host label / runner label : callisto
#   server clone path         : /Users/nickgreenway/docker/mealie/mealie-mcp
#   compose project dir       : /Users/nickgreenway/docker/mealie
#     (mealie-mcp service lives in docker-compose.override.yml there — box infra,
#      auto-merged with the root-owned docker-compose.yml; keeps that file untouched)
#   compose service           : mealie-mcp

on:
  push:
    branches: [deploy]
  workflow_dispatch: {}   # manual re-deploy from the Actions tab

# Serialize deploys so two quick pushes don't rebuild at the same time.
concurrency:
  group: deploy-callisto
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, callisto]
    steps:
      - name: Pull, rebuild, and restart the mealie-mcp container
        shell: bash
        run: |
          set -euo pipefail

          # Docker Desktop's CLI isn't on the login-less runner PATH by default.
          export PATH="/usr/local/bin:$PATH"

          # The git clone the box builds from (owned by the runner's user).
          CLONE_DIR="/Users/nickgreenway/docker/mealie/mealie-mcp"
          # The Mealie compose PROJECT dir. The mealie-mcp service is defined in
          # docker-compose.override.yml here (box infra, not in the repo); a bare
          # `docker compose` from this dir auto-merges base + override.
          PROJECT_DIR="/Users/nickgreenway/docker/mealie"
          SERVICE="mealie-mcp"

          if [ ! -d "$CLONE_DIR/.git" ]; then
            echo "::error title=Server clone missing::No git repo at $CLONE_DIR — is the runner running as the user that owns the clone?"
            exit 1
          fi

          cd "$CLONE_DIR"
          echo "Pulling into: $CLONE_DIR"
          before="$(git rev-parse HEAD)"
          git pull --ff-only
          after="$(git rev-parse HEAD)"

          if [ "$before" = "$after" ]; then
            echo "Already up to date at ${after:0:7} — nothing to publish."
            exit 0
          fi

          echo "Published ${before:0:7} -> ${after:0:7}. Changed files:"
          git diff --name-only "$before" "$after"

          # Ensure the Dockerfile's base image is in the local store. BuildKit
          # otherwise re-resolves the tag from Docker Hub on every build, which
          # intermittently times out / rate-limits and fails the deploy. Pull
          # only when missing (with retries) so normal deploys stay offline-fast.
          BASE_IMAGE="$(awk 'toupper($1)=="FROM"{print $2; exit}' "$CLONE_DIR/Dockerfile")"
          if [ -n "$BASE_IMAGE" ] && ! docker image inspect "$BASE_IMAGE" >/dev/null 2>&1; then
            echo "Base image $BASE_IMAGE not present locally; pulling..."
            for a in 1 2 3; do
              docker pull "$BASE_IMAGE" && break
              echo "pull attempt $a failed; retrying in 10s..."; sleep 10
              [ "$a" = 3 ] && { echo "::error title=Base image pull failed::Could not pull $BASE_IMAGE after 3 attempts."; exit 1; }
            done
          fi

          echo "Rebuilding image and recreating container..."
          cd "$PROJECT_DIR"
          docker compose up -d --build "$SERVICE"

          echo "Waiting for /health..."
          for i in $(seq 1 30); do
            if docker compose exec -T "$SERVICE" \
                 python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)" 2>/dev/null; then
              echo "Container healthy."
              exit 0
            fi
            sleep 2
          done
          echo "::warning title=Health check timed out::Container restarted but /health did not return 200 within 60s. Check 'docker compose logs $SERVICE'."
